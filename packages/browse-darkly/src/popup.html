<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
    }
    .popup {
      padding: 16px;
    }
    .popup-header h1 {
      margin: 0 0 12px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
    }
    .popup-domain {
      font-size: 12px;
      color: #888;
      margin-bottom: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .popup-toggle {
      display: block;
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #2a2a4e;
      color: #e0e0e0;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .popup-toggle:hover {
      background: #3a3a6e;
    }
    .popup-toggle.active {
      background: #4a4a8e;
    }
    .popup-settings {
      display: block;
      width: 100%;
      padding: 8px;
      margin-top: 8px;
      border: 1px solid #333;
      border-radius: 8px;
      background: transparent;
      color: #888;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .popup-settings:hover {
      border-color: #555;
      color: #ccc;
    }
    .popup-loading, .popup-unavailable {
      text-align: center;
      padding: 20px 0;
      color: #666;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="root"></div>
</body>
</html>
