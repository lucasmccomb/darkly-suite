name = "darkly-suite"
compatibility_date = "2024-09-23"
pages_build_output_dir = "dist"

[vars]
ENVIRONMENT = "production"
SITE_URL = "https://darklysuite.com"
SITE_URL_GMAIL = "https://gmaildarkly.com"
SITE_URL_SHEETS = "https://sheetsdarkly.com"
SITE_URL_DOCS = "https://docsdarkly.com"
SITE_URL_BROWSE = "https://browsedarkly.com"
# All Stripe IDs (prices + products) are set as production secrets, never committed.
# For local dev, use .dev.vars with sandbox values. See .env.example for the full list.

# database_id is an account-scoped identifier, not a credential — it is unusable
# without Cloudflare account access, and wrangler requires it to bind D1 on deploy.
[[d1_databases]]
binding = "DB"
database_name = "darkly-suite-db"
database_id = "da5dbede-9d2a-4549-8100-4b03b56dd820"
