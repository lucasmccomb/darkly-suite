version: 2
updates:
  # GitHub Actions are pinned to full-length commit SHAs (see PR #677) with a
  # trailing "# vX.Y.Z" comment. Dependabot understands that convention and
  # bumps both the SHA and the comment together, so the pins do not age
  # silently as upstream actions cut new releases.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
